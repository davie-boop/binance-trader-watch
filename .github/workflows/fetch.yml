name: Binance Trader Watch

# 每 15 分钟抓取一次熬鹰资本的最新交易，有新记录才推送微信。
# 云端全新环境，靠仓库里的 cloud_state.json 跨运行去重。
# 分钟取 1/16/31/46 而非整点：GitHub 在整点附近负载高，定时可能被延迟或丢弃。
on:
  schedule:
    - cron: '1,16,31,46 * * * *'   # UTC 时间，每 15 分钟（避开整点）
  workflow_dispatch:           # 允许在 Actions 页面手动触发

# 需要写权限，才能把更新后的 cloud_state.json 提交回仓库
permissions:
  contents: write

# 避免同一时刻多个运行并发（防止状态文件冲突）
concurrency:
  group: trader-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch latest trades and notify
        env:
          TW_KOPYON_API_KEY: ${{ secrets.TW_KOPYON_API_KEY }}
          TW_TRADER_IDS: ${{ secrets.TW_TRADER_IDS }}
          TW_NOTIFY_CHANNEL: ${{ secrets.TW_NOTIFY_CHANNEL }}
          TW_PUSHPLUS_TOKEN: ${{ secrets.TW_PUSHPLUS_TOKEN }}
          TW_NOTIFY_ONLY_NEW: 'true'
        run: python -m trader_watcher.cli cloud-fetch

      # 多个 run（GitHub schedule + 本地定时器 + cron-job.org）可能基于同一个旧
      # commit 更新状态文件。这里每轮先同步远程最新版本、合并 seen 并集，再提交；
      # push 被拒时重新拉取并重试，避免 non-fast-forward 导致整个 run 变红。
      - name: Commit state file if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp cloud_state.json /tmp/local_state.json
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD
            git show FETCH_HEAD:cloud_state.json > /tmp/remote_state.json 2>/dev/null \
              || echo '{"seen":[],"initialized":false,"updated_at":""}' > /tmp/remote_state.json
            python -m trader_watcher.cli state-merge \
              /tmp/local_state.json /tmp/remote_state.json cloud_state.json
            if git diff --quiet -- cloud_state.json; then
              echo "state already up to date (attempt $attempt)"
              exit 0
            fi
            git add cloud_state.json
            git commit --quiet -m "chore: update cloud fetch state [skip ci]"
            if git push origin HEAD:main; then
              echo "state pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected, retrying (attempt $attempt)..."
            sleep $((attempt * 2))
          done
          echo "::warning::cloud_state.json push failed after retries; next run will merge again"
